name: Secret Guard

on:
  push:
    branches: [ main, "fixes/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan tracked files for credential files
        shell: bash
        run: |
          echo "Checking for committed credential files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(accounts_pool.*\.json|credentials.*\.json|secrets.*\.json)' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Forbidden credential file(s) tracked in git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No forbidden credential file paths found."

      - name: Scan tracked files for secret patterns
        shell: bash
        run: |
          echo "Scanning tracked files for credential shapes..."
          ERRORS=0

          # Construct regex tokens without having the literal regex match this workflow file
          PK_PAT="-----BEGIN[[:space:]]+[A-Z0-9_-]+[[:space:]]+PRIVATE[[:space:]]+KEY-----"
          GHP_PAT="ghp_[A-Za-z0-9_]{16,}"
          AKIA_PAT="AKIA[0-9A-Z]{16}"
          PWD_JSON_PAT='"pass''word"[[:space:]]*:[[:space:]]*"[^"]{4,}"'

          while IFS= read -r file; do
            # Skip this workflow file and README.md placeholders
            if [ "$file" = ".github/workflows/secret-guard.yml" ] || [ "$file" = "README.md" ]; then
              continue
            fi

            if [ -f "$file" ]; then
              # Check for private keys
              MATCH_PK=$(grep -En "$PK_PAT" "$file" || true)
              if [ -n "$MATCH_PK" ]; then
                echo "::error file=$file::Private key pattern detected in $file:"
                echo "$MATCH_PK"
                ERRORS=$((ERRORS + 1))
              fi

              # Check for GitHub tokens
              MATCH_GHP=$(grep -En "$GHP_PAT" "$file" || true)
              if [ -n "$MATCH_GHP" ]; then
                echo "::error file=$file::GitHub token pattern detected in $file:"
                echo "$MATCH_GHP"
                ERRORS=$((ERRORS + 1))
              fi

              # Check for AWS keys
              MATCH_AKIA=$(grep -En "$AKIA_PAT" "$file" || true)
              if [ -n "$MATCH_AKIA" ]; then
                echo "::error file=$file::AWS key pattern detected in $file:"
                echo "$MATCH_AKIA"
                ERRORS=$((ERRORS + 1))
              fi

              # Check for JSON password values
              MATCH_PWD=$(grep -En '"password"[[:space:]]*:[[:space:]]*"[^"]{4,}"' "$file" || true)
              if [ -n "$MATCH_PWD" ]; then
                echo "::error file=$file::Hardcoded password pattern detected in $file:"
                echo "$MATCH_PWD"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done < <(git ls-files)

          if [ "$ERRORS" -gt 0 ]; then
            echo "Secret scan failed with $ERRORS finding(s)."
            exit 1
          fi
          echo "Secret scan passed with 0 findings."
